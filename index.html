<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AJECAM NORTE - Digital Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #0a0f1e; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes pulse-slow { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.2; } }
        .animate-pulse-slow { animation: pulse-slow 8s infinite; }
    </style>
</head>
<body class="text-slate-100 font-sans overflow-x-hidden pb-32">

    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-5%] left-[-5%] w-[60%] h-[60%] bg-blue-600/10 blur-[120px] rounded-full animate-pulse-slow"></div>
    </div>

    <div class="relative z-10 p-6 max-w-xl mx-auto">
        <header class="flex flex-col items-center mb-10 pt-6">
            <div class="relative w-20 h-20 flex items-center justify-center bg-[#161b2c] rounded-[2rem] border border-white/10 shadow-2xl mb-6">
               <i data-lucide="zap" class="w-10 h-10 text-cyan-400"></i>
            </div>
            <h1 class="text-3xl font-black tracking-tighter text-center uppercase">
                AJECAM <span class="text-cyan-400">NORTE</span>
            </h1>
        </header>

        <div class="space-y-6">
            <button onclick="launchCameraApp('https://artrade-ajemaya-production.up.railway.app/')" 
                class="group relative w-full flex flex-col p-6 glass-card rounded-[2.5rem] text-left transition-all active:scale-[0.96]">
                <div class="flex items-start justify-between mb-4">
                    <div class="p-4 rounded-2xl bg-gradient-to-br from-red-600 to-red-800 text-white shadow-lg shadow-red-500/20">
                        <i data-lucide="camera" class="w-8 h-8"></i>
                    </div>
                    <i data-lucide="external-link" class="w-5 h-5 text-slate-500"></i>
                </div>
                <div>
                    <h3 class="text-[10px] font-black tracking-widest text-cyan-500 mb-1 uppercase">Módulo de Visión</h3>
                    <h2 class="text-2xl font-bold text-white mb-1">Artrade</h2>
                    <p class="text-sm text-slate-400 leading-relaxed font-medium">Pulsa para abrir con permisos de cámara activados.</p>
                </div>
            </button>

            <button onclick="handleLaunch('https://t.me/ajemayabot/geoaje')" class="group relative w-full flex flex-col p-6 glass-card rounded-[2.5rem] text-left transition-all active:scale-[0.96]">
                <div class="flex items-start justify-between mb-4">
                    <div class="p-4 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/20">
                        <i data-lucide="globe-2" class="w-8 h-8"></i>
                    </div>
                </div>
                <div>
                    <h3 class="text-[10px] font-black tracking-widest text-cyan-500 mb-1 uppercase">Geolocalización</h3>
                    <h2 class="text-2xl font-bold text-white mb-1">GeoAje</h2>
                </div>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Hack para pedir cámara antes de salir de la app
        function launchCameraApp(url) {
            if (tg.requestCamera) {
                tg.requestCamera((allowed) => {
                    if (allowed) {
                        // Si nos da permiso, abrimos con el navegador de sistema que SÍ permite cámara
                        tg.openLink(url, { try_instant_view: false });
                    } else {
                        // Si no, intentamos abrirlo de todos modos como última opción
                        tg.openLink(url);
                    }
                });
            } else {
                // Para versiones de Telegram que no soportan requestCamera directamente
                tg.openLink(url);
            }
        }

        function handleLaunch(url) {
            tg.openTelegramLink(url);
        }

        function closeApp() { tg.close(); }
        
        // Cargar iconos
        lucide.createIcons();
    </script>
</body>
</html>
