<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AJECAM HUB - AR FIX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #05070a; color: white; font-family: sans-serif; }
        .cyber-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 255, 0.2);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-md mx-auto space-y-8 pt-10">
        <header class="text-center">
            <h1 class="text-3xl font-black tracking-tighter text-cyan-400">AJECAM HUB</h1>
            <p class="text-[10px] uppercase tracking-[0.3em] text-slate-500">Módulo de Realidad Aumentada</p>
        </header>

        <div class="cyber-card p-8 rounded-[2rem] text-center space-y-6">
            <div class="w-20 h-20 bg-cyan-500/10 rounded-full flex items-center justify-center mx-auto border border-cyan-500/30">
                <i data-lucide="camera" class="w-10 h-10 text-cyan-400"></i>
            </div>
            
            <div class="space-y-2">
                <h2 class="text-xl font-bold">Artrade AR</h2>
                <p class="text-sm text-slate-400">Si ves la pantalla negra, usa el botón de abajo para forzar los permisos de cámara del sistema.</p>
            </div>

            <button onclick="forceARLaunch()" class="w-full py-4 bg-cyan-500 text-black font-black rounded-2xl shadow-[0_0_20px_rgba(6,182,212,0.4)] active:scale-95 transition-all uppercase tracking-widest text-sm">
                ACTIVAR CÁMARA Y ABRIR
            </button>
        </div>

        <p id="status-log" class="text-[9px] font-mono text-slate-600 text-center uppercase tracking-tighter"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function log(msg) {
            document.getElementById('status-log').innerText = msg;
        }

        async function forceARLaunch() {
            const url = "https://artrade-ajemaya-production.up.railway.app/";
            log("Iniciando protocolo de cámara...");

            // Paso 1: Intentar disparar el permiso nativo de Telegram
            if (tg.requestCamera) {
                tg.requestCamera(function(allowed) {
                    if (allowed) {
                        log("Permiso concedido. Abriendo navegador externo...");
                        // Paso 2: Abrir con bypass de Instant View y forzar navegador completo
                        tg.openLink(url, { try_instant_view: false });
                    } else {
                        log("Permiso denegado por usuario. Reintentando apertura directa...");
                        tg.openLink(url, { try_instant_view: false });
                    }
                });
            } else {
                // Paso 3: Fallback para versiones viejas de Telegram
                log("API antigua detectada. Forzando link...");
                tg.openLink(url, { try_instant_view: false });
            }
        }

        lucide.createIcons();
    </script>
</body>
</html>
